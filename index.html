<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e120f">
  <title>Astra Audio - Full Tracks</title>
  <style>
    :root {
      --bg: #0e120f;
      --card: #151b16;
      --card-hover: #1c241e;
      --border: #222d24;
      --green: #22c55e;
      --green-glow: rgba(34, 197, 94, 0.22);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --player-h: 88px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: radial-gradient(circle at 85% 0%, #162b1b 0%, var(--bg) 45%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 24px;
    }
    body.has-active-player {
      padding-bottom: calc(var(--player-h) + 24px);
    }
    button, input { font: inherit; }
    button { cursor: pointer; border: none; background: none; }

    .topbar {
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: rgba(14, 18, 15, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-size: 16px;
      font-weight: 800;
      color: var(--green);
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-box {
      flex: 1;
      height: 42px;
      display: flex;
      align-items: center;
      background: #172018;
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 0 14px;
      gap: 8px;
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 13px;
    }
    .search-box button {
      color: var(--green);
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .main-wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 16px;
    }

    .hero-card {
      background: linear-gradient(135deg, #1b3522 0%, #131e16 100%);
      border: 1px solid #2b4933;
      border-radius: 18px;
      padding: 22px 18px;
      margin-bottom: 22px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .hero-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--green);
      margin-bottom: 8px;
    }
    .hero-title {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 6px 0;
      letter-spacing: -0.5px;
    }
    .hero-sub {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 16px 0;
      line-height: 1.4;
    }
    .action-pill {
      background: var(--green);
      color: #051408;
      font-weight: 700;
      font-size: 12px;
      padding: 10px 18px;
      border-radius: 99px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 12px 0;
    }
    .sec-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }
    .refresh-btn {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .refresh-btn:hover { color: var(--green); }

    .track-list {
      display: grid;
      gap: 9px;
    }
    .track-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 12px;
      transition: background 0.15s, border-color 0.15s;
    }
    .track-row:hover {
      background: var(--card-hover);
      border-color: #314433;
    }
    .track-art {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      background: #1b251d;
      flex-shrink: 0;
    }
    .track-meta {
      flex: 1;
      overflow: hidden;
    }
    .t-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .t-sub {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .t-time {
      font-size: 10px;
      color: var(--green);
      font-weight: 600;
      margin-top: 2px;
    }
    .play-circle {
      width: 38px;
      height: 38px;
      background: var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #051408;
      flex-shrink: 0;
    }
    .play-circle:active {
      transform: scale(0.92);
    }

    .tags-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .tag-item {
      background: linear-gradient(135deg, #1c2e20, #131e16);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 12px;
      text-align: left;
      color: #fff;
    }
    .tag-label {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }
    .tag-name {
      font-size: 15px;
      font-weight: 700;
    }

    /* Player Dock */
    .player-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--player-h);
      background: rgba(16, 21, 17, 0.97);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 10px 16px 12px;
      z-index: 50;
      display: none;
      flex-direction: column;
      justify-content: center;
    }
    body.has-active-player .player-dock {
      display: flex;
    }
    .dock-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    .dock-art {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      background: #253829;
      flex-shrink: 0;
    }
    .dock-meta {
      flex: 1;
      overflow: hidden;
    }
    .dock-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dock-artist {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dock-ctrl {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dock-ctrl button {
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dock-play-btn {
      width: 36px;
      height: 36px;
      background: var(--green) !important;
      border-radius: 50%;
      color: #051408 !important;
    }

    .dock-seek-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .seek-container {
      position: relative;
      flex: 1;
      height: 16px;
      display: flex;
      align-items: center;
    }
    .buffer-bar {
      position: absolute;
      left: 0;
      height: 4px;
      width: 0%;
      background: #39523d;
      border-radius: 2px;
      pointer-events: none;
      transition: width 0.2s;
    }
    .seek-bar {
      position: relative;
      z-index: 2;
      width: 100%;
      appearance: none;
      height: 4px;
      background: transparent;
      outline: none;
      cursor: pointer;
    }
    .seek-bar::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--green);
    }
    .time-badge {
      font-size: 10px;
      color: var(--muted);
      min-width: 28px;
      font-variant-numeric: tabular-nums;
    }
    .loading-notice {
      text-align: center;
      padding: 30px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      ASTRA
    </div>
    <form class="search-box" id="searchForm">
      <input type="search" id="searchInput" placeholder="Search song title, artist, genre..." autocomplete="off">
      <button type="submit" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </form>
  </header>

  <main class="main-wrap">
    <div class="hero-card">
      <span class="hero-badge">FULL-LENGTH AUDIO STREAMING</span>
      <h1 class="hero-title">Uninterrupted Music</h1>
      <p class="hero-sub">Complete full-duration streaming without 30-second limitations.</p>
      <button class="action-pill" onclick="triggerShuffle()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7z"/></svg>
        Play Trending Tracks
      </button>
    </div>

    <div class="sec-head">
      <h2 class="sec-title" id="sectionHeading">Trending Tracks</h2>
      <button class="refresh-btn" onclick="renderHype()">Refresh</button>
    </div>
    <div class="track-list" id="trackList"></div>

    <div class="sec-head" style="margin-top:26px;">
      <h2 class="sec-title">Quick Genres & Hype</h2>
    </div>
    <div class="tags-grid">
      <button class="tag-item" onclick="filterBy('rock')">
        <span class="tag-label">01 / ENERGETIC</span>
        <span class="tag-name">Rock & Indie</span>
      </button>
      <button class="tag-item" onclick="filterBy('lofi')">
        <span class="tag-label">02 / CHILL</span>
        <span class="tag-name">Lofi Chillout</span>
      </button>
      <button class="tag-item" onclick="filterBy('electronic')">
        <span class="tag-label">03 / BEATS</span>
        <span class="tag-name">Electronic Dance</span>
      </button>
      <button class="tag-item" onclick="filterBy('acoustic')">
        <span class="tag-label">04 / RELAX</span>
        <span class="tag-name">Acoustic Pop</span>
      </button>
    </div>
  </main>

  <footer class="player-dock">
    <div class="dock-top">
      <img id="dockArt" class="dock-art" src="" alt="Album Cover">
      <div class="dock-meta">
        <div id="dockTitle" class="dock-title">Select Song</div>
        <div id="dockArtist" class="dock-artist">Astra Audio</div>
      </div>
      <div class="dock-ctrl">
        <button onclick="skipPrev()" aria-label="Prev">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="dock-play-btn" id="playBtn" onclick="togglePlay()" aria-label="Play">
          <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7z"/></svg>
        </button>
        <button onclick="skipNext()" aria-label="Next">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6z"/></svg>
        </button>
      </div>
    </div>
    <div class="dock-seek-wrap">
      <span id="timeCur" class="time-badge">0:00</span>
      <div class="seek-container">
        <div id="bufferBar" class="buffer-bar"></div>
        <input type="range" id="seekBar" class="seek-bar" min="0" value="0" step="1">
      </div>
      <span id="timeTot" class="time-badge">0:00</span>
    </div>
  </footer>

  <audio id="audioEl" preload="none"></audio>

  <script>
    const audio = document.getElementById('audioEl');
    const playIcon = document.getElementById('playIcon');
    const trackList = document.getElementById('trackList');
    const seekBar = document.getElementById('seekBar');
    const bufferBar = document.getElementById('bufferBar');
    const timeCur = document.getElementById('timeCur');
    const timeTot = document.getElementById('timeTot');

    let currentQueue = [];
    let activeIdx = -1;

    // Free Client ID for Jamendo Open Audio Stream API
    const CLIENT_ID = '709fa152';

    // Verified High-Quality Full Audio Fallback Tracks
    const FALLBACK_FULL_TRACKS = [
      { id: 'f1', title: 'Winning Vibe (Chill Instrumental)', artist: 'Lofi Producer', duration: 214, art: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150&auto=format&fit=crop&q=60', stream: 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3' },
      { id: 'f2', title: 'Zara Romance (Acoustic Night)', artist: 'Guitar Moods', duration: 298, art: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=150&auto=format&fit=crop&q=60', stream: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=relaxed-vape-109355.mp3' },
      { id: 'f3', title: 'Midnight Starlight Beat', artist: 'Synth Wave Collective', duration: 200, art: 'https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=150&auto=format&fit=crop&q=60', stream: 'https://cdn.pixabay.com/download/audio/2022/10/14/audio_9939f792cb.mp3?filename=chill-abstract-intention-12099.mp3' },
      { id: 'f4', title: 'Heavy Bass Hip Hop Anthem', artist: 'Street Flow', duration: 270, art: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=150&auto=format&fit=crop&q=60', stream: 'https://cdn.pixabay.com/download/audio/2021/11/01/audio_00fa5b42d7.mp3?filename=hip-hop-rock-beat-11270.mp3' },
      { id: 'f5', title: 'Summer Tropical Horizon', artist: 'Sunset Beats', duration: 192, art: 'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=150&auto=format&fit=crop&q=60', stream: 'https://cdn.pixabay.com/download/audio/2022/03/10/audio_5a850be196.mp3?filename=tropical-house-108785.mp3' }
    ];

    window.addEventListener('beforeunload', (e) => {
      if (!audio.paused && audio.currentTime > 0) {
        e.preventDefault();
        e.returnValue = 'Playback active';
      }
    });

    function renderTracks(tracks) {
      currentQueue = tracks;
      trackList.innerHTML = tracks.map((t, idx) => `
        <div class="track-row" onclick="startPlay(${idx})">
          <img class="track-art" src="${t.art || 'https://placehold.co/100x100/182019/a6f36a?text=Audio'}" alt="" loading="lazy">
          <div class="track-meta">
            <div class="t-title">${t.title}</div>
            <div class="t-sub">${t.artist}</div>
            <div class="t-time">${fmt(t.duration)} (Full Track)</div>
          </div>
          <div class="play-circle">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7z"/></svg>
          </div>
        </div>
      `).join('');
    }

    // High Speed Jamendo Full-Stream Search & Chart API
    async function executeSearch(query) {
      document.getElementById('sectionHeading').textContent = `Results for "${query}"`;
      trackList.innerHTML = '<div class="loading-notice">Fetching full tracks...</div>';

      try {
        const timeout = new Promise((_, reject) => setTimeout(() => reject('timeout'), 4500));
        const url = `https://api.jamendo.com/v3.0/tracks/?client_id=${CLIENT_ID}&format=json&limit=15&namesearch=${encodeURIComponent(query)}&audioformat=mp31&include=musicinfo`;
        const fetchReq = fetch(url);
        const res = await Promise.race([fetchReq, timeout]);
        const data = await res.json();

        if (data.results && data.results.length) {
          const list = data.results.map(r => ({
            id: String(r.id),
            title: r.name,
            artist: r.artist_name,
            duration: r.duration || 210,
            art: r.image || 'https://placehold.co/100x100/182019/a6f36a?text=Track',
            stream: r.audio // Full length MP3 stream
          }));
          renderTracks(list);
          return;
        }
      } catch (err) {}

      // Fallback matching
      const matches = FALLBACK_FULL_TRACKS.filter(t => 
        t.title.toLowerCase().includes(query.toLowerCase()) || 
        t.artist.toLowerCase().includes(query.toLowerCase())
      );
      renderTracks(matches.length ? matches : FALLBACK_FULL_TRACKS);
    }

    async function renderHype() {
      document.getElementById('sectionHeading').textContent = 'Trending Full Tracks';
      trackList.innerHTML = '<div class="loading-notice">Loading top tracks...</div>';

      try {
        const timeout = new Promise((_, reject) => setTimeout(() => reject('timeout'), 4500));
        const url = `https://api.jamendo.com/v3.0/tracks/?client_id=${CLIENT_ID}&format=json&limit=15&order=popularity_total&audioformat=mp31`;
        const res = await Promise.race([fetch(url), timeout]);
        const data = await res.json();

        if (data.results && data.results.length) {
          const list = data.results.map(r => ({
            id: String(r.id),
            title: r.name,
            artist: r.artist_name,
            duration: r.duration || 220,
            art: r.image,
            stream: r.audio // Full length MP3 stream
          }));
          renderTracks(list);
          return;
        }
      } catch (err) {}

      renderTracks(FALLBACK_FULL_TRACKS);
    }

    function startPlay(idx) {
      if (idx < 0 || idx >= currentQueue.length) return;
      activeIdx = idx;
      const track = currentQueue[activeIdx];

      document.body.classList.add('has-active-player');
      document.getElementById('dockTitle').textContent = track.title;
      document.getElementById('dockArtist').textContent = track.artist;
      document.getElementById('dockArt').src = track.art || 'https://placehold.co/100x100/182019/a6f36a?text=Track';

      // On-demand lazy load only for the clicked track
      audio.src = track.stream;
      audio.load();
      audio.play().then(() => setPlayState(true)).catch(() => setPlayState(false));
    }

    function togglePlay() {
      if (!audio.src) return;
      if (audio.paused) {
        audio.play();
        setPlayState(true);
      } else {
        audio.pause();
        setPlayState(false);
      }
    }

    function setPlayState(isPlaying) {
      playIcon.innerHTML = isPlaying 
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' 
        : '<path d="m8 5 11 7-11 7z"/>';
    }

    function skipNext() {
      if (currentQueue.length) startPlay((activeIdx + 1) % currentQueue.length);
    }

    function skipPrev() {
      if (currentQueue.length) startPlay((activeIdx - 1 + currentQueue.length) % currentQueue.length);
    }

    // Auto-Next Continuous Radio
    audio.onended = () => skipNext();

    audio.ontimeupdate = () => {
      const dur = audio.duration || currentQueue[activeIdx]?.duration || 0;
      seekBar.max = Math.floor(dur) || 0;
      seekBar.value = Math.floor(audio.currentTime) || 0;
      timeCur.textContent = fmt(audio.currentTime);
      timeTot.textContent = fmt(dur);
    };

    // Live Buffer Progress
    audio.onprogress = () => {
      if (audio.buffered.length > 0 && audio.duration > 0) {
        const bufferedEnd = audio.buffered.end(audio.buffered.length - 1);
        const percent = Math.min(100, Math.max(0, (bufferedEnd / audio.duration) * 100));
        bufferBar.style.width = percent + '%';
      }
    };

    seekBar.oninput = () => { audio.currentTime = seekBar.value; };

    function fmt(s) {
      if (!s || isNaN(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function triggerShuffle() {
      if (currentQueue.length) startPlay(Math.floor(Math.random() * currentQueue.length));
    }

    function filterBy(q) {
      document.getElementById('searchInput').value = q;
      executeSearch(q);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('searchInput').value.trim();
      if (val) executeSearch(val);
    });

    renderHype();
  </script>
</body>
</html>
