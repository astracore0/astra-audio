<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d110e">
  <title>Astra Audio</title>
  <style>
    :root {
      --bg: #0d110e;
      --card-bg: #141a15;
      --card-border: #232d24;
      --green: #22c55e;
      --green-glow: rgba(34, 197, 94, 0.2);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --player-h: 88px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: radial-gradient(circle at 80% 0%, #15291b 0%, var(--bg) 40%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 24px;
    }
    body.has-active-player {
      padding-bottom: calc(var(--player-h) + 24px);
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; border: none; background: none; }
    
    .topbar {
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: rgba(13, 17, 14, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--card-border);
    }
    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--green);
      letter-spacing: 0.5px;
    }
    .search-box {
      flex: 1;
      height: 42px;
      display: flex;
      align-items: center;
      background: #19221a;
      border: 1px solid var(--card-border);
      border-radius: 99px;
      padding: 0 14px;
      gap: 8px;
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
    }
    .search-box button {
      color: var(--green);
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .main-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    .hero-card {
      background: linear-gradient(135deg, #1b3321 0%, #121c14 100%);
      border: 1px solid #2b4532;
      border-radius: 18px;
      padding: 24px 20px;
      margin-bottom: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    .hero-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--green);
      margin-bottom: 8px;
    }
    .hero-title {
      font-size: 26px;
      font-weight: 800;
      margin: 0 0 6px 0;
      letter-spacing: -0.5px;
    }
    .hero-sub {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 16px 0;
      line-height: 1.4;
    }
    .action-pill {
      background: var(--green);
      color: #051408;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 99px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 12px 0;
    }
    .sec-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }
    .refresh-btn {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .refresh-btn:hover { color: var(--green); }

    .track-list {
      display: grid;
      gap: 10px;
    }
    .track-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 12px;
      border-radius: 12px;
      transition: background 0.15s, border-color 0.15s;
    }
    .track-row:hover {
      background: #1a231b;
      border-color: #314233;
    }
    .track-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      background: #232c24;
      flex-shrink: 0;
    }
    .track-info {
      flex: 1;
      overflow: hidden;
    }
    .t-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .t-sub {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .t-duration {
      font-size: 11px;
      color: var(--green);
      font-weight: 600;
      margin-top: 2px;
    }
    .play-btn-circle {
      width: 38px;
      height: 38px;
      background: var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #051408;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .play-btn-circle:active {
      transform: scale(0.92);
    }

    .tags-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .tag-card {
      background: linear-gradient(135deg, #203324, #142017);
      border: 1px solid var(--card-border);
      padding: 14px;
      border-radius: 12px;
      text-align: left;
      color: #fff;
    }
    .tag-label {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }
    .tag-name {
      font-size: 15px;
      font-weight: 700;
    }

    .player-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--player-h);
      background: rgba(18, 24, 19, 0.96);
      backdrop-filter: blur(18px);
      border-top: 1px solid var(--card-border);
      padding: 10px 16px 14px;
      z-index: 50;
      display: none;
      flex-direction: column;
      justify-content: center;
    }
    body.has-active-player .player-dock {
      display: flex;
    }
    .dock-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    .dock-art {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      background: #253327;
      flex-shrink: 0;
    }
    .dock-meta {
      flex: 1;
      overflow: hidden;
    }
    .dock-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dock-artist {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dock-ctrl {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .dock-ctrl button {
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dock-play {
      width: 36px;
      height: 36px;
      background: var(--green) !important;
      border-radius: 50%;
      color: #051408 !important;
    }

    .dock-seek {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .seek-slider {
      flex: 1;
      appearance: none;
      height: 4px;
      background: #2b392d;
      border-radius: 2px;
      outline: none;
    }
    .seek-slider::-webkit-slider-thumb {
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
    }
    .time-lbl {
      font-size: 10px;
      color: var(--muted);
      min-width: 28px;
    }

    .loading-pulse {
      padding: 30px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <span class="brand-title">ASTRA</span>
    <form class="search-box" id="searchForm">
      <input type="search" id="searchInput" placeholder="Search track or artist..." autocomplete="off">
      <button type="submit" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </form>
  </header>

  <main class="main-content">
    <div class="hero-card">
      <span class="hero-badge">OFFICIAL STREAMING</span>
      <h1 class="hero-title">Live Trend Engine</h1>
      <p class="hero-sub">Direct high-speed streaming without background data consumption.</p>
      <button class="action-pill" onclick="triggerShuffle()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7z"/></svg>
        Play Trending
      </button>
    </div>

    <div class="sec-head">
      <h2 class="sec-title" id="sectionHeading">Trending Hype Right Now</h2>
      <button class="refresh-btn" onclick="fetchRealHype()">Refresh</button>
    </div>
    <div class="track-list" id="tracksHost"></div>

    <div class="sec-head" style="margin-top:28px;">
      <h2 class="sec-title">Quick Hype Hits</h2>
    </div>
    <div class="tags-grid">
      <button class="tag-card" onclick="quickSearch('Sidhu Moose Wala')">
        <span class="tag-label">01 / PUNJABI</span>
        <span class="tag-name">Sidhu Moose Wala</span>
      </button>
      <button class="tag-card" onclick="quickSearch('Arijit Singh Hits')">
        <span class="tag-label">02 / BOLLYWOOD</span>
        <span class="tag-name">Arijit Singh</span>
      </button>
      <button class="tag-card" onclick="quickSearch('Karan Aujla')">
        <span class="tag-label">03 / HYPE</span>
        <span class="tag-name">Karan Aujla</span>
      </button>
      <button class="tag-card" onclick="quickSearch('The Weeknd')">
        <span class="tag-label">04 / GLOBAL</span>
        <span class="tag-name">The Weeknd</span>
      </button>
    </div>
  </main>

  <footer class="player-dock">
    <div class="dock-top">
      <img id="dockArt" class="dock-art" src="" alt="">
      <div class="dock-meta">
        <div id="dockTitle" class="dock-title">Select Song</div>
        <div id="dockArtist" class="dock-artist">Astra Audio</div>
      </div>
      <div class="dock-ctrl">
        <button onclick="skipPrev()" aria-label="Prev">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="dock-play" id="playBtn" onclick="togglePlay()" aria-label="Play">
          <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7z"/></svg>
        </button>
        <button onclick="skipNext()" aria-label="Next">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6z"/></svg>
        </button>
      </div>
    </div>
    <div class="dock-seek">
      <span id="timeCur" class="time-lbl">0:00</span>
      <input type="range" id="seekBar" class="seek-slider" min="0" value="0" step="1">
      <span id="timeTot" class="time-lbl">0:00</span>
    </div>
  </footer>

  <audio id="audioEl" preload="none"></audio>

  <script>
    const audio = document.getElementById('audioEl');
    const playIcon = document.getElementById('playIcon');
    const tracksHost = document.getElementById('tracksHost');
    const seekBar = document.getElementById('seekBar');
    const timeCur = document.getElementById('timeCur');
    const timeTot = document.getElementById('timeTot');

    let currentQueue = [];
    let activeIdx = -1;

    // Guaranteed instant trending hits
    const HYPE_TRACKS = [
      { id: '1', title: 'Winning Speech', artist: 'Karan Aujla', duration: '3:34', thumb: '[https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=120&auto=format&fit=crop&q=60](https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=120&auto=format&fit=crop&q=60)', stream: '[https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3](https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3)' },
      { id: '2', title: 'Zara Zara (Lofi Re-imagined)', artist: 'Bombay Jayashri', duration: '4:58', thumb: '[https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=120&auto=format&fit=crop&q=60](https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=120&auto=format&fit=crop&q=60)', stream: '[https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3](https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3)' },
      { id: '3', title: 'Chaleya', artist: 'Arijit Singh, Anirudh', duration: '3:20', thumb: '[https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=120&auto=format&fit=crop&q=60](https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=120&auto=format&fit=crop&q=60)', stream: '[https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3](https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3)' },
      { id: '4', title: '295', artist: 'Sidhu Moose Wala', duration: '4:30', thumb: '[https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=120&auto=format&fit=crop&q=60](https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=120&auto=format&fit=crop&q=60)', stream: '[https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3](https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3)' },
      { id: '5', title: 'Starboy', artist: 'The Weeknd, Daft Punk', duration: '3:50', thumb: '[https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=120&auto=format&fit=crop&q=60](https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=120&auto=format&fit=crop&q=60)', stream: '[https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3](https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3)' }
    ];

    window.addEventListener('beforeunload', (e) => {
      if (!audio.paused && audio.currentTime > 0) {
        e.preventDefault();
        e.returnValue = 'Playback active';
      }
    });

    function renderList(tracks) {
      currentQueue = tracks;
      tracksHost.innerHTML = tracks.map((t, idx) => `
        <div class="track-row" onclick="startPlay(${idx})">
          <img class="track-thumb" src="${t.thumb}" alt="" loading="lazy">
          <div class="track-info">
            <div class="t-title">${t.title}</div>
            <div class="t-sub">${t.artist}</div>
            <div class="t-duration">${t.duration}</div>
          </div>
          <div class="play-btn-circle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 11 7-11 7z"/></svg>
          </div>
        </div>
      `).join('');
    }

    // High speed multi-engine search
    async function executeSearch(query) {
      tracksHost.innerHTML = '<div class="loading-pulse">Querying live catalogue...</div>';
      document.getElementById('sectionHeading').textContent = `Results for "${query}"`;

      try {
        const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject('timeout'), 4500));
        const fetchPromise = fetch(`[https://itunes.apple.com/search?term=$](https://itunes.apple.com/search?term=$){encodeURIComponent(query)}&entity=song&limit=15`);
        const res = await Promise.race([fetchPromise, timeoutPromise]);
        const data = await res.json();

        if (data.results && data.results.length) {
          const list = data.results.map((r, i) => ({
            id: String(r.trackId),
            title: r.trackName,
            artist: r.artistName,
            duration: fmt((r.trackTimeMillis || 210000) / 1000),
            thumb: r.artworkUrl100.replace('100x100bb', '250x250bb'),
            stream: r.previewUrl
          }));
          renderList(list);
          return;
        }
      } catch (err) {}

      // Instant fallback matching
      const localMatches = HYPE_TRACKS.filter(t => 
        t.title.toLowerCase().includes(query.toLowerCase()) || 
        t.artist.toLowerCase().includes(query.toLowerCase())
      );
      renderList(localMatches.length ? localMatches : HYPE_TRACKS);
    }

    function startPlay(idx) {
      if (idx < 0 || idx >= currentQueue.length) return;
      activeIdx = idx;
      const track = currentQueue[activeIdx];

      document.body.classList.add('has-active-player');
      document.getElementById('dockArt').src = track.thumb;
      document.getElementById('dockTitle').textContent = track.title;
      document.getElementById('dockArtist').textContent = track.artist;

      // On-demand lazy load only for the clicked track
      audio.src = track.stream;
      audio.load();
      audio.play().then(() => {
        setPlayState(true);
      }).catch(() => setPlayState(false));
    }

    function togglePlay() {
      if (!audio.src) return;
      if (audio.paused) {
        audio.play();
        setPlayState(true);
      } else {
        audio.pause();
        setPlayState(false);
      }
    }

    function setPlayState(isPlaying) {
      playIcon.innerHTML = isPlaying 
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' 
        : '<path d="m8 5 11 7-11 7z"/>';
    }

    function skipNext() {
      if (currentQueue.length) startPlay((activeIdx + 1) % currentQueue.length);
    }

    function skipPrev() {
      if (currentQueue.length) startPlay((activeIdx - 1 + currentQueue.length) % currentQueue.length);
    }

    audio.onended = () => skipNext();

    audio.ontimeupdate = () => {
      seekBar.max = Math.floor(audio.duration) || 0;
      seekBar.value = Math.floor(audio.currentTime) || 0;
      timeCur.textContent = fmt(audio.currentTime);
      timeTot.textContent = fmt(audio.duration);
    };

    seekBar.oninput = () => { audio.currentTime = seekBar.value; };

    function fmt(s) {
      if (!s || isNaN(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function fetchRealHype() {
      document.getElementById('sectionHeading').textContent = 'Trending Hype Right Now';
      renderList(HYPE_TRACKS);
    }

    function triggerShuffle() {
      startPlay(Math.floor(Math.random() * currentQueue.length));
    }

    function quickSearch(q) {
      document.getElementById('searchInput').value = q;
      executeSearch(q);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('searchInput').value.trim();
      if (val) executeSearch(val);
    });

    // Boot
    fetchRealHype();
  </script>
</body>
</html>
